<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogIn</title>

    <link rel="stylesheet" href="../css/style/reset.css" />
    <link rel="stylesheet" href="../css/style/normalize.css" />
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="login-card">
      <header>
        <h1>
          <span>Login</span>
          <span class="divider">|</span>
          <a href="register.html" id="hrefINlogin">Register</a>
        </h1>
      </header>

      <main>
        <p id="chapter">Enter your email and password to login.</p>

        <form class="login-form">
          <div class="input-group">
            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="input-group">
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
          </div>

          <button type="submit" id="btn" class="login-btn"><b>Login</b></button>
        </form>
      </main>

      <div class="social-divider">
        <span>Or login with</span>
      </div>

      <div class="social-buttons">
        <button type="button" class="social-btn">
          <img src="../images/google 1.svg" alt="Google" class="images" />
          Continue with Google
        </button>

        <button type="button" class="social-btn">
          <img src="../images/facebook 1.svg" alt="Facebook" class="images" />
          Continue with Facebook
        </button>
      </div>
    </div>
  </body>
</html>
